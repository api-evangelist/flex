name: Flex
description: Flex is a consumer financial technology company that lets renters pay their
  monthly rent in smaller installments spread across the month, instead of a single
  lump sum on the due date, so payments better fit each person's pay schedule and cash
  flow. The company pays the landlord or property manager in full on the due date and
  collects from the renter over the month, positioning itself as a flexible-payments
  layer on top of the largest recurring expense most households carry. Founded in 2019
  and headquartered in New York City, Flex operates a consumer mobile app and partners
  with property-management platforms; it is backed by Lightspeed Venture Partners and
  surfaced in the 500 Global portfolio. Flex publishes no public developer API,
  developer portal, or discovery surface today - this profile is a network lead.
